server {
    host 127.0.0.1;
    port 8080;

    error_page 404 /errors/404.html;
    client_max_body_size 10M;

    location / {
        root ./www;
        methods GET POST;
        index index.html;
        directory_listing off;
    }

    location /upload {
        root ./uploads;
        methods POST;
    }

    location /cgi-bin {
        root ./cgi-bin;
        methods GET POST;
        cgi .py python3;
    }
}