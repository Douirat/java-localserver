# LocalServer configuration
# Paths are relative to wherever run.sh starts the process (project root),
# matching the existing resources/ tree.

server {
    host 0.0.0.0;
    port 8080;
    server_name localhost;
    default_server on;
    client_max_body_size 10M;

    error_page 404 resources/error_pages/404.html;
    error_page 500 resources/error_pages/500.html;
    error_page 400 resources/error_pages/400.html;
    error_page 403 resources/error_pages/403.html;
    error_page 405 resources/error_pages/405.html;
    error_page 413 resources/error_pages/413.html;

    location / {
        root resources/www;
        index index.html;
        methods GET;
    }

    location /uploads {
        root resources/uploads;
        upload_dir resources/uploads;
        methods GET POST DELETE;
    }

    location /cgi-bin {
        root resources/cgi-bin;
        cgi .py python3;
        index hello.py;
        methods GET POST;
    }

    location /files/ {
        root resources/www;
        directory_listing on;
        methods GET;
    }

    location /no-listing/ {
        root resources/uploads/videos;
        directory_listing off;
        methods GET;
    }

    location /old-page {
        return 301 http://localhost:8080/;
    }
}

# Virtual host A - shares 0.0.0.0:8080 with the default server above,
# distinguished purely by the Host header (test_virtual_host.sh).
server {
    host 0.0.0.0;
    port 8080;
    server_name site-a.local;

    location / {
        root resources/www;
        index index.html;
        methods GET;
    }
}

# Virtual host B - same address, different server_name.
server {
    host 0.0.0.0;
    port 8080;
    server_name site-b.local;

    location / {
        root resources/www;
        index index.html;
        methods GET;
    }
}

# Independent second server on a different port (multi-port audit test,
# also what test_port_conflict.sh's VALID_PORT=8081 expects to be up).
server {
    host 0.0.0.0;
    port 8081;
    server_name port-test;
    default_server on;

    location / {
        root resources/www;
        index index.html;
        methods GET;
    }
}